name: Build LUMA Setup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            runner: windows-2025
            architecture: x64
          - name: Mac-arm64
            runner: macos-15
            architecture: arm64
          - name: Mac-x64
            runner: macos-15-intel
            architecture: x64
    defaults:
      run:
        working-directory: setup-desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.16'
          architecture: ${{ matrix.architecture }}
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test safe installation flow without a TV
        run: |
          python -m unittest discover -s tests -v
          python main.py --self-test
      - name: Build native self-contained program and verify resources
        run: python tools/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LUMA-Setup-${{ matrix.name }}
          path: setup-desktop/release/*
          if-no-files-found: error
          retention-days: 30
