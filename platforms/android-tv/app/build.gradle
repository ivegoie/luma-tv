plugins { id 'com.android.application' }
android {
    namespace 'io.github.ivegoie.lumatv'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.ivegoie.lumatv'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    // Release signing is configured separately before publishing an installable APK.
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
